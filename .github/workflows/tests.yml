name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q custom_components tools tests
      - run: python -m unittest discover -s tests -p test_protocol.py -v
      - run: python tools/validate_metadata.py
  home_assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install pytest-homeassistant
      - run: python -m pytest tests/test_ha.py -v
